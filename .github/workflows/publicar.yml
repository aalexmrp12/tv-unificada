name: Actualizar playlist M3U y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *' # Revisa cambios en deportes cada dia

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Combinar listas
        run: python3 mezclar.py
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir archivos de la web
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
